# Replace travel.example.com with the same TRAVEL_AGENT_PUBLIC_ORIGIN used by API and MCP.
server {
    listen 443 ssl;
    server_name travel.example.com;
    # Supply the deployment's existing TLS certificate configuration here.
    client_max_body_size 6m;
    location = /mcp {
        proxy_pass http://127.0.0.1:8798;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location / {
        proxy_pass http://127.0.0.1:8797;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
