<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel Agent · 工作台交互设计</title></head>
<body><div class="review-strip"><span>交互设计稿 · 合成资料仅在本机演示 · 不调用正式服务</span><nav aria-label="设计方向"><button data-world="ceramic">蓝白路书</button><button data-world="lake">湖绿日程</button><button id="reset-demo">重置演示</button></nav></div>
<div class="travel-app"><header class="app-header"><a class="brand" href="#" aria-label="Travel Agent 首页"><span class="brand-symbol" aria-hidden="true"></span>Travel Agent</a><div class="trip-identity"><h1>京都，慢慢走三天</h1><span class="trip-state">未采用草案</span><p>12月4日—6日 · 2位同行人 · 当地时间</p></div><div class="header-actions"><button data-panel="party">2人 · 少走路</button><button data-panel="budget">预算 ¥9,000</button><button data-panel="journal" class="icon-action" aria-label="照片手账"></button></div></header>
<main class="workspace"><nav class="days" aria-label="每日安排"></nav><section class="day-pane" aria-label="每日行程"><header class="day-heading"></header><div class="itinerary-scroll"><div class="itinerary"></div></div></section><section class="map-pane" aria-label="行程地图"><div id="map"></div><div class="map-heading"><strong>京都</strong><span>点地点，回到它的安排</span></div><button id="fit-day" class="map-fit">查看整天</button><div class="map-key"><span></span>地点顺序示意 · 不是导航线路</div><div class="map-failure" hidden>底图暂时无法读取，地点定位仍可使用。</div><div class="map-peek"></div></section><aside class="inspector" hidden aria-label="当前操作"></aside></main>
<footer class="trip-footer"><div class="footer-copy"></div><div class="footer-actions"><button id="trip-conditions">旅行条件</button><button id="adopt-preview" class="primary">审阅并采用</button></div></footer></div><div class="toast" role="status" hidden></div><script type="module" src="./main.js"></script></body></html>
